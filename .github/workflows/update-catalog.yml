name: Обновление каталога программ

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:          # и вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать каталог из релизов
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_catalog.py
      - name: Закоммитить, если что-то изменилось
        run: |
          if [ -n "$(git status --porcelain programs.html index.html)" ]; then
            git config user.name "mirrormirage-bot"
            git config user.email "actions@users.noreply.github.com"
            git add programs.html index.html
            git commit -m "Каталог: автообновление из релизов"
            git push
          fi
